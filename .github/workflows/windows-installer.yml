# Builds the Windows desktop installer (NEONDRIFT-GP-Setup.exe) and publishes
# it as a GitHub Release, so anyone can download it without logging in:
#   https://github.com/Krishna-44/neon-drift-/releases/latest/download/NEONDRIFT-GP-Setup.exe
# Running the installer adds a desktop shortcut and a Start-menu entry.
name: Windows installer

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write # create/update the GitHub Release

concurrency:
  group: windows-installer
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Bundle the hand model + HDRI for offline play.
      - run: npm run setup
        continue-on-error: true # the game falls back to CDN / procedural assets
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: NEONDRIFT-GP-Windows-Installer
          path: release/NEONDRIFT-GP-Setup.exe
          if-no-files-found: error
      # Only main (or a manual run) updates the public download; other
      # branches just produce the artifact above.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"
          NAME=NEONDRIFT-GP-Setup.exe
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Passing the file to `create` keeps the release a draft until the
            # upload finishes, so the public link never points at an empty release.
            gh release create "$TAG" "release/$NAME" --target "$GITHUB_SHA" --latest \
              --title "NEONDRIFT GP $TAG (Windows)" \
              --notes "Download **$NAME** below and run it. It installs the game and adds a desktop shortcut. If Windows SmartScreen warns (the app is unsigned), click **More info → Run anyway**."
          else
            # Replace without a download gap: upload under a temporary name,
            # then delete the old asset and rename the new one into place.
            TMP=NEONDRIFT-GP-Setup.next.exe
            cp "release/$NAME" "release/$TMP"
            gh release upload "$TAG" "release/$TMP" --clobber
            api="repos/$GITHUB_REPOSITORY/releases"
            asset_id() { gh api "$api/tags/$TAG" --jq ".assets[] | select(.name == \"$1\") | .id"; }
            NEW_ID=$(asset_id "$TMP")
            OLD_ID=$(asset_id "$NAME")
            if [ -n "$OLD_ID" ]; then gh api -X DELETE "$api/assets/$OLD_ID"; fi
            gh api -X PATCH "$api/assets/$NEW_ID" -f name="$NAME" >/dev/null
          fi
