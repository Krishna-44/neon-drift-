# Builds the Windows desktop installer (NEONDRIFT GP Setup x.y.z.exe).
# Download it from the workflow run's "Artifacts" section. Running the
# installer adds a desktop shortcut and a Start-menu entry.
name: Windows installer

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Bundle the hand model + HDRI for offline play.
      - run: npm run setup
        continue-on-error: true # the game falls back to CDN / procedural assets
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: NEONDRIFT-GP-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
