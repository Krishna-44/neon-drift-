name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    env:
      # The Electron binary isn't needed to typecheck, test or build the web bundle.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm test

      - name: Production build
        run: npx vite build
